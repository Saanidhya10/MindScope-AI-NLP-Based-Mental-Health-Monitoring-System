
# =============================================================================
# Emotional & Mental Health Monitoring - NLP-Based Sentiment Analysis
# Central configuration. Every script in src/ and scripts/ should read from
# here (via src/utils.py: load_config) rather than hard-coding values.
#
# To override locally without editing this file, create config/local.yaml
# (git-ignored) and merge it on top in load_config().
# =============================================================================

project:
  name: mental-health-nlp
  version: "0.1.0"
  seed: 42                      # one seed everywhere -> fair, reproducible comparisons
  disclaimer: >
    This is a wellness-support and early-awareness tool. It is NOT a diagnostic
    instrument and does not replace a qualified mental health professional.

# -----------------------------------------------------------------------------
# Paths (relative to repository root)
# -----------------------------------------------------------------------------
paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_splits: data/splits
  models_dir: models
  results_dir: results
  figures_dir: results/figures
  reports_dir: results/reports
  database: data/processed/mood_history.db

# -----------------------------------------------------------------------------
# Emotion taxonomy (8 application-relevant classes, from the synopsis)
# -----------------------------------------------------------------------------
labels:
  classes: [Joy, Sadness, Anger, Fear, Anxiety, Stress, Surprise, Neutral]
  # Used by the trend + recommendation modules
  negative_classes: [Sadness, Anger, Fear, Anxiety, Stress]
  positive_classes: [Joy]
  neutral_classes: [Neutral, Surprise]

# -----------------------------------------------------------------------------
# Datasets
# -----------------------------------------------------------------------------
data:
  goemotions:
    enabled: true
    role: primary fine-grained emotion classification
    hf_dataset_id: google-research-datasets/go_emotions   # verify id on the HF Hub if loading fails
    hf_config: simplified
    raw_filename: goemotions.csv
    # GoEmotions is multi-label. Policy for collapsing to single-label 8-class data:
    #   drop_conflicting : keep rows whose labels all map to ONE of our 8 classes (recommended)
    #   first_label      : keep the first annotated label only
    multilabel_policy: drop_conflicting

  dreaddit:
    enabled: true
    role: Stress class + domain fine-tuning
    download_url: http://www.cs.columbia.edu/~eturcan/data/dreaddit.zip   # verify; manual download is fine
    raw_filename: dreaddit.csv
    max_tokens: 128                  # posts are long -> truncate
    # label==1 (stressed) -> "stress". label==0 (not stressed) is NOT the same as "neutral".
    #   drop        : discard non-stressed posts (recommended; avoids label noise)
    #   as_neutral  : map to neutral (only if you can justify it in the report)
    non_stressed_policy: drop

  sentiment140:
    enabled: false                   # optional coarse benchmark; skip if short on time
    role: supplementary pretraining / coarse sentiment benchmark
    source: kaggle kazanova/sentiment140 or HF stanfordnlp/sentiment140   # verify
    raw_filename: sentiment140.csv
    subsample_size: 50000            # 1.6M tweets is far too large; subsample

  text_column: text
  label_column: label
  min_text_chars: 3                  # drop empty / near-empty rows

  # Stratified splits - create ONCE (Day 1) and never change the test set
  splits:
    train: 0.80
    val: 0.10
    test: 0.10
    stratify: true
    filenames:
      train: train.csv
      val: val.csv
      test: test.csv

# -----------------------------------------------------------------------------
# GoEmotions (27 + neutral) -> 8-class mapping
# Anxiety comes only from "nervousness"; Stress comes ONLY from Dreaddit.
# Labels not listed here are dropped. Review and justify this mapping in the report.
# -----------------------------------------------------------------------------
label_mapping:
  goemotions:
    Joy:      [admiration, amusement, approval, caring, excitement, gratitude, joy, love, optimism, pride, relief]
    Sadness:  [sadness, grief, disappointment, remorse, embarrassment]
    Anger:    [anger, annoyance, disapproval, disgust]
    Fear:     [fear]
    Anxiety:  [nervousness]
    Surprise: [surprise, realization]
    Neutral:  [neutral, confusion, curiosity, desire]
  dreaddit:
    stressed: stress
    not_stressed: null               # see data.dreaddit.non_stressed_policy

# -----------------------------------------------------------------------------
# Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  lowercase: true
  remove_urls: true
  remove_html: true
  remove_user_handles: true          # @mentions and u/ r/ references
  normalize_punctuation: true
  demojize_emojis: true              # keep affective signal: :crying_face: -> "crying face"
  lemmatize: true                    # classical + Bi-LSTM pipelines
  remove_stopwords_classical_only: true   # transformers always receive raw (cleaned) text
  keep_negations: true               # keep "not", "no", "never" even when stripping stop-words
  spacy_model: en_core_web_sm

# -----------------------------------------------------------------------------
# Models
# -----------------------------------------------------------------------------
models:
  classical:
    tfidf:
      max_features: 50000
      ngram_range: [1, 2]
      min_df: 2
      sublinear_tf: true
    logistic_regression:
      C: 1.0
      max_iter: 1000
      solver: lbfgs
    linear_svc:
      C: 1.0
      max_iter: 5000
    random_forest:
      n_estimators: 300
      max_depth: null
      n_jobs: -1
    output_dir: models/classical

  bilstm:
    embedding: glove-wiki-gigaword-100     # gensim.downloader name
    embedding_dim: 100
    freeze_embeddings: false
    hidden_size: 128
    num_layers: 1
    bidirectional: true
    dropout: 0.3
    max_len: 64
    vocab_max_size: 30000
    batch_size: 64
    epochs: 10
    learning_rate: 0.001
    early_stopping_patience: 2
    output_dir: models/bilstm

  transformers:
    # Shared fine-tuning settings (identical across models for a fair comparison)
    max_len: 64
    epochs: 3
    batch_size: 32
    learning_rate: 0.00002             # 2e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    fp16: true                         # set false on CPU
    gradient_accumulation_steps: 1
    metric_for_best_model: macro_f1
    early_stopping_patience: 2
    save_total_limit: 2                # save checkpoints to Google Drive on Colab
    distilbert:
      pretrained: distilbert-base-uncased
      output_dir: models/distilbert
    roberta:
      pretrained: roberta-base
      output_dir: models/roberta

  # Model whose mitigation experiments are run + used by the app (set after Day 6)
  best_model_for_experiments: distilbert
  deployed_model: distilbert

# Seeds used by `--seeds` defaults in src/train_bilstm.py and src/train_transformer.py
seeds: [42]

# -----------------------------------------------------------------------------
# Flat sections read directly by src/train_bilstm.py and src/train_transformer.py
# (values mirror models.bilstm / models.transformers above - keep them in sync)
# -----------------------------------------------------------------------------
bilstm:
  embedding: glove                     # glove | word2vec | random
  glove_path: data/raw/glove.6B.100d.txt   # download from nlp.stanford.edu/projects/glove; falls back to random init if missing
  embedding_dim: 100
  freeze_embeddings: false
  hidden: 128
  dropout: 0.3
  max_len: 64
  vocab: { min_freq: 2, max_size: 30000 }
  batch_size: 64
  epochs: 10
  lr: 0.001
  patience: 2
  grid:                                # every combo needs all four keys
    hidden: [128, 256]
    dropout: [0.3]
    lr: [0.001, 0.0005]
    embedding: [glove]

transformer:
  models:
    distilbert: distilbert-base-uncased
    roberta: roberta-base
  max_len: 64
  epochs: 3
  batch_size: 32
  lr: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 2
  grid:
    lr: [0.00002, 0.00003]
    batch_size: [16, 32]

# -----------------------------------------------------------------------------
# Class-imbalance experiments (the research core)
# RULE: mitigation touches the TRAIN split only. Val/test stay untouched.
# -----------------------------------------------------------------------------
imbalance:
  experiments:
    - baseline            # unmitigated
    - class_weighting
    - random_oversampling
    - synonym_augmentation
    - backtranslation_augmentation
  class_weighting:
    mode: balanced                     # balanced | sqrt_balanced
  random_oversampling:
    sampling_strategy: not majority    # imbalanced-learn strategy name
  minority_threshold_share: 0.05       # classes with <5% of train rows are "minority"
  primary_metric: per_class_f1
  secondary_metric: macro_f1

augmentation:
  minority_classes_only: true
  target_min_samples_per_class: 3000   # augment up to roughly this many train rows per class
  synonym_replacement:
    library: nlpaug
    aug_p: 0.15
    n_aug_per_sample: 2
  back_translation:
    enabled: true
    pivot_language: fr                 # en -> fr -> en
    forward_model: Helsinki-NLP/opus-mt-en-fr
    backward_model: Helsinki-NLP/opus-mt-fr-en
    batch_size: 32
    max_length: 128

# -----------------------------------------------------------------------------
# Temporal aggregation (daily / weekly / monthly mood trends)
# -----------------------------------------------------------------------------
trends:
  # Smoothing + escalation (read by src/trends.py and the app)
  alpha: 0.3                           # EMA weight of the newest day
  tau: 0.55                            # smoothed negative-affect score that counts as "high"
  k: 3                                 # consecutive high check-in days before suggesting support
  max_gap_days: 3                      # a gap longer than this between check-ins resets the run
  window_days: 14                      # escalation only looks at the most recent window
  # No real per-user timelines exist -> build SIMULATED ones (state this in the report)
  simulation:
    start_date: "2025-01-01"
    days: 21
    msgs_per_day: [2, 5]               # min, max
    scenarios: [stable_positive, drift_to_stress, isolated_negative, sustained_negative, recovery]

# -----------------------------------------------------------------------------
# Recommendation + safety (rule-based, non-diagnostic). Escalation thresholds live under trends.
# -----------------------------------------------------------------------------
recommend:
  suggestions:
    stress:
      title: Slow your breathing
      text: "Breathe in for 4 seconds, hold for 4, and breathe out for 6. A few minutes of this can take the edge off."
    anxiety:
      title: Ground yourself in the room
      text: "Try a grounding exercise: name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell and 1 you can taste."
    sadness:
      title: Reach out to someone
      text: "Send a short message to someone you trust, or step outside for a ten-minute walk. Small comforts count on heavy days."
    anger:
      title: Give it a few minutes
      text: "Step away before you reply. A brisk walk, or writing down exactly what annoyed you, can help you decide what matters."
    fear:
      title: Make the worry smaller
      text: "Write down the one thing you are most afraid of, then one small step you can control. Telling someone about it helps too."
    joy:
      title: Notice what helped
      text: "Jot down what made today good, so you can come back to it on harder days."
    surprise:
      title: Let it settle
      text: "Unexpected news can take a while to land. Check in with how you feel about it once it has."
    neutral:
      title: Keep checking in
      text: "Short, regular entries make it easier to spot changes over weeks."
  support_message: >
    Your entries have shown difficult feelings for several days in a row. This app cannot diagnose
    anything, but talking to a counsellor, a doctor or someone you trust can really help.
    You don't have to deal with this alone.
  # VERIFY every number below before shipping or demoing. Numbers change.
  helplines:
    - { country: IN, name: Tele-MANAS, number: "14416 or 1800-891-4416", note: "Free, 24x7, government mental-health line", verified: false }
    - { country: IN, name: Emergency services, number: "112", note: "If you or someone else is in immediate danger", verified: false }
    - { country: IN, name: Vandrevala Foundation, number: "+91 9999 666 555", note: "24x7 call or WhatsApp", verified: false }
    # - { country: US, name: 988 Suicide & Crisis Lifeline, number: "988", verified: false }
  # Phrases that show a message needs the helplines immediately, whatever the model predicts.
  crisis_phrases:
    - suicide
    - suicidal
    - kill myself
    - end my life
    - end it all
    - want to die
    - better off dead
    - self harm
    - self-harm
    - hurt myself
    - cutting myself
    - hang myself
    - take my own life
    - no reason to live
    - mar jaana
    - marne ka man
    - jaan dena

# -----------------------------------------------------------------------------
# Storage + privacy
# -----------------------------------------------------------------------------
database:
  engine: sqlite                       # synopsis lists MongoDB/MySQL/Firebase; SQLite is fine for the prototype
  path: data/processed/mood_history.db   # schema in src/database.py; raw text is not stored

# Privacy is enforced in code: src/database.py refuses to store anything without consent and never
# stores raw text unless store_text=True is passed explicitly (the app never does).

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  metrics: [accuracy, precision, recall, f1, macro_f1]
  average: macro
  per_class_report: true
  confusion_matrix: true
  zero_division: 0
  results_files:
    model_metrics: results/model_metrics.csv
    model_comparison: results/model_comparison.csv
    imbalance_results: results/imbalance_results.csv
    trend_quality: results/trend_quality.csv
    latency_results: results/latency_results.csv
  latency:
    warmup_runs: 10
    n_runs: 100
    sample_texts:
      - "I can't sleep and my mind keeps racing about tomorrow."
      - "Honestly today was great, we finally finished the project!"
      - "ok"
  error_analysis:
    categories: [sarcasm, short_text, minority_class, mixed_emotion]
    short_text_max_tokens: 5

# -----------------------------------------------------------------------------
# App (Streamlit dashboard; the roadmap notes this is much faster than Flask + JS)
# -----------------------------------------------------------------------------
app:
  max_input_chars: 1000

# -----------------------------------------------------------------------------
# Voice entries (src/voice.py), English only. Recordings are processed in memory and never saved.
# -----------------------------------------------------------------------------
voice:
  asr_model: small.en                  # faster-whisper English-only model (~0.5 GB, downloaded on first use)
  asr_compute_type: int8               # fast on CPU
  max_seconds: 180
  min_words: 3
  # Tone of voice: pretrained speech-emotion model (IEMOCAP, 4 classes) mapped onto our classes
  tone_model: superb/wav2vec2-base-superb-er
  tone_labels: { neu: Neutral, hap: Joy, ang: Anger, sad: Sadness }
  # Weight of tone in the blend. One-directional: tone can add evidence of distress but never
  # lowers the difficult-feelings share of what was said (acted-speech models are unreliable on real voices).
  tone_weight: 0.25

# -----------------------------------------------------------------------------
# Inference
# -----------------------------------------------------------------------------
inference:
  # Model used by the app and scripts/demo.py.
  #   goemotions : public RoBERTa fine-tuned on GoEmotions (downloads ~500 MB on first run; never predicts Stress)
  #   classical  : models/classical/logreg_baseline/pipeline.joblib (our trained baseline, used as the fallback)
  #   transformer: models/distilbert/final once you fine-tune it (scripts/train_all.py)
  kind: goemotions
  path: SamLowe/roberta-base-go_emotions
  max_len: 128
  device: cpu
  batch_size: 64

logging:
  level: INFO
  file: null
